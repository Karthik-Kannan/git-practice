name: Build APK

on:
  push:
    branches: [claude/android-receipt-capture-svsp65]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"

      - name: Run parser unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Stage APKs
        id: stage
        run: |
          mkdir -p dist
          OUT=app/build/outputs/apk/debug
          cp "$OUT/app-arm64-v8a-debug.apk"   dist/receiptsnap-arm64.apk
          cp "$OUT/app-armeabi-v7a-debug.apk" dist/receiptsnap-arm32.apk
          cp "$OUT/app-universal-debug.apk"   dist/receiptsnap-universal.apk
          ls -lh dist/
          {
            echo "arm64=$(du -h dist/receiptsnap-arm64.apk | cut -f1)"
            echo "universal=$(du -h dist/receiptsnap-universal.apk | cut -f1)"
          } >> "$GITHUB_OUTPUT"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: receiptsnap-apk
          path: dist/*.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="apk-${{ github.run_number }}"
          gh release create "$TAG" dist/*.apk \
            --title "ReceiptSnap APK (build ${{ github.run_number }})" \
            --notes "Debug-signed, built from \`${{ github.sha }}\`.

          - **\`receiptsnap-arm64.apk\`** (${{ steps.stage.outputs.arm64 }}) — grab this one; every Android phone from roughly 2019 on is arm64.
          - \`receiptsnap-arm32.apk\` — older 32-bit devices.
          - \`receiptsnap-universal.apk\` (${{ steps.stage.outputs.universal }}) — all architectures, including x86 emulators.

          Allow install from unknown sources, then open the downloaded file." \
            --target "${{ github.sha }}"
